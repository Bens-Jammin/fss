name: FSS Benchmark Test

on:
  push:
    branches: [main, benchmark]
  workflow_dispatch: # allows for manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  Build-and-Setup-Benchmark:  # build fss executables
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Compile code
        run: |
          make lib
          make cli
      # TODO: test FAILS!
      # - name: Test functionality of FSS
      #   run: make test
      - name: Add CLI executable to bin
        run: |
          bin=$(find . -type f -perm -u+x \( -name 'fss_cli' -o -name 'fss-cli' \) -not -path '*/deps/*' | head -n 1)
          if [ -z "$bin" ]; then
            echo "CLI binary not found" >&2
            exit 1
          fi
          sudo install -m 755 "$bin" /usr/local/bin/fss
          fss --help
      - uses: actions/upload-artifact@v4
        with:
          name: fss
          path: /usr/local/bin/fss
  BENCHMARK-NiTH-Balanced:
    runs-on: ubuntu-latest
    needs: Build-and-Setup-Benchmark
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fss
          path: .
      - name: Install FSS
        run: |
          chmod +x fss
          sudo install -m 755 fss /usr/local/bin/fss
      - name: Verify FSS
        run: |
          which fss
          fss --help
      - name: Prepare benchmark trees
        run: |
          cd /
          sudo rm -rf benchmark_trees
          sudo mkdir benchmark_trees
          sudo chown "$USER:$(id -gn)" benchmark_trees
          cd benchmark_trees

          # ============================================================
          # BALANCED TREE
          #
          # 10-way branching, 5 levels deep.
          # 10^5 = 100,000 leaf directories
          # 1 file per leaf = ~100,000 files
          # ============================================================

          mkdir balanced

          # 1. Create all 100,000 nested directories in one shot
          mkdir -p balanced/{01..10}/{01..10}/{01..10}/{01..10}/{01..10}

          # 2. Create the file inside every directory instantly
          touch balanced/{01..10}/{01..10}/{01..10}/{01..10}/{01..10}/file

          # Needle deliberately placed in the final directory.
          touch balanced/10/10/10/10/10/NEEDLE

          # ============================================================
          # SUMMARY
          # ============================================================

          echo "Benchmark trees created:"
          echo
          echo "Balanced:"
          find balanced -type f | wc -l

          echo
          echo "Total:"
          find . -type f | wc -l

          echo
          echo "Needles:"
          find . -name NEEDLE -print

      - name: Build index
        run: |
          fss init --root "/benchmark_trees/balanced" 2>&1 | tee /tmp/index_output.txt
      - name: Collect indexing timing data
        run: |
          output=$(cat /tmp/index_output.txt)
          fscrawl=$(echo "$output" | grep -oP '^FSCrawl:\s+\K\d+(?= ms)' | head -n1)
          insert=$(echo "$output" | grep -oP '^insertFileEntries:\s+\K\d+(?= ms)' | head -n1)
          metadata=$(echo "$output" | grep -oP '^update_metadata_table:\s+\K\d+(?= ms)' | head -n1)
          total=$(echo "$output" | grep -oP '^Total:\s+\K\d+(?= ms)' | head -n1)
          [ -z "$fscrawl" ] && fscrawl="unknown"
          [ -z "$insert" ] && insert="unknown"
          [ -z "$metadata" ] && metadata="unknown"
          [ -z "$total" ] && total="unknown"
          jq -n \
            --arg benchmark "balanced" \
            --arg fscrawl_ms "$fscrawl" \
            --arg insert_ms "$insert" \
            --arg metadata_ms "$metadata" \
            --arg total_ms "$total" \
            --arg output "$output" \
            '{benchmark: $benchmark, fscrawl_ms: $fscrawl_ms, insert_ms: $insert_ms, metadata_ms: $metadata_ms, total_ms: $total_ms, output: $output}' \
            > benchmark-balanced.json
          cat benchmark-balanced.json
      - uses: actions/upload-artifact@v4
        with:
          name: results-balanced
          path: benchmark-balanced.json
  BENCHMARK-NiTH-WideDeep:
    runs-on: ubuntu-latest
    needs: Build-and-Setup-Benchmark
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fss
          path: .
      - name: Install FSS
        run: |
          chmod +x fss
          sudo install -m 755 fss /usr/local/bin/fss
      - name: Verify FSS
        run: |
          which fss
          fss --help
      - name: Prepare benchmark trees
        run: |
          cd /
          sudo rm -rf benchmark_trees
          sudo mkdir benchmark_trees
          sudo chown "$USER:$(id -gn)" benchmark_trees
          cd benchmark_trees

          # ============================================================
          # WIDE-DEEP TREE
          #
          # 100 x 100 directories, 10 files per leaf.
          # ~100,000 files total.
          # ============================================================

          # 1. Create all 10,000 directories instantly
          mkdir -p wide_deep/{001..100}/{001..100}

          # 2. Create all 100,000 files simultaneously
          touch wide_deep/{001..100}/{001..100}/file_{01..10}

          # Needle deliberately placed in the final leaf.
          touch wide_deep/100/100/NEEDLE

          # ============================================================
          # SUMMARY
          # ============================================================

          echo "Benchmark trees created:"
          echo
          echo "Wide-deep:"
          find wide_deep -type f | wc -l

          echo
          echo "Needles:"
          find . -name NEEDLE -print

      - name: Build index
        run: |
          fss init --root "/benchmark_trees/wide_deep" 2>&1 | tee /tmp/index_output.txt
      - name: Collect indexing timing data
        run: |
          output=$(cat /tmp/index_output.txt)
          fscrawl=$(echo "$output" | grep -oP '^FSCrawl:\s+\K\d+(?= ms)' | head -n1)
          insert=$(echo "$output" | grep -oP '^insertFileEntries:\s+\K\d+(?= ms)' | head -n1)
          metadata=$(echo "$output" | grep -oP '^update_metadata_table:\s+\K\d+(?= ms)' | head -n1)
          total=$(echo "$output" | grep -oP '^Total:\s+\K\d+(?= ms)' | head -n1)
          [ -z "$fscrawl" ] && fscrawl="unknown"
          [ -z "$insert" ] && insert="unknown"
          [ -z "$metadata" ] && metadata="unknown"
          [ -z "$total" ] && total="unknown"
          jq -n \
            --arg benchmark "wide_deep" \
            --arg fscrawl_ms "$fscrawl" \
            --arg insert_ms "$insert" \
            --arg metadata_ms "$metadata" \
            --arg total_ms "$total" \
            --arg output "$output" \
            '{benchmark: $benchmark, fscrawl_ms: $fscrawl_ms, insert_ms: $insert_ms, metadata_ms: $metadata_ms, total_ms: $total_ms, output: $output}' \
            > benchmark-wide-deep.json
          cat benchmark-wide-deep.json
      - uses: actions/upload-artifact@v4
        with:
          name: results-wide-deep
          path: benchmark-wide-deep.json
  Publish-Results:
    runs-on: ubuntu-latest
    needs: [BENCHMARK-NiTH-Balanced, BENCHMARK-NiTH-WideDeep]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FSS_PAGES_PAT: ${{ secrets.FSS_PAGES_PAT }}
    steps:
      - name: Enable GitHub Pages site
        if: env.FSS_PAGES_PAT != ''
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $FSS_PAGES_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          if [ "$code" = "404" ]; then
            echo "Pages site missing - creating it..."
            curl -s -X POST \
              -H "Authorization: Bearer $FSS_PAGES_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}'
          else
            echo "Pages site exists (HTTP $code)"
          fi
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Generate HTML report
        run: |
          python3 - <<'EOF'
          import json, glob, html, os, datetime

          BASELINE = {'fscrawl_ms': 2058, 'insert_ms': 975, 'metadata_ms': 10, 'total_ms': 3044}
          PHASES = [
              ('fscrawl_ms', 'File Crawling', '#4e79a7'),
              ('insert_ms', 'DB Insertion', '#f28e2b'),
              ('metadata_ms', 'Metadata Recording', '#59a14f'),
          ]
          METRICS = PHASES + [('total_ms', 'Total', '#b07aa1')]
          BENCH_COLORS = ['#4e79a7', '#e15759', '#76b7b2', '#f28e2b']


          def num(d, key):
              try:
                  v = float(str(d.get(key, '')).strip())
                  return int(v) if v == int(v) else v
              except (TypeError, ValueError):
                  return None


          records = []
          for path in sorted(glob.glob('results/*.json')):
              with open(path) as f:
                  records.append(json.load(f))

          benches = []
          for i, d in enumerate(records):
              benches.append((html.escape(str(d.get('benchmark', '?'))), d,
                              BENCH_COLORS[i % len(BENCH_COLORS)]))

          # Chart 1: horizontal 100% stacked bars (phase breakdown per benchmark)
          phase_bars = ''
          for name, d, _ in benches:
              vals = {k: num(d, k) for k, _, _ in PHASES}
              total = num(d, 'total_ms')
              known = [v for v in vals.values() if v is not None]
              if not total:
                  total = sum(known) if known else 0
              segs = ''
              for k, label, color in PHASES:
                  v = vals[k]
                  if v is None or total <= 0:
                      continue
                  pct = min(v * 100.0 / total, 100.0)
                  if pct >= 14:
                      inner = '%d ms (%.0f%%)' % (v, pct)
                  elif pct >= 6:
                      inner = '%.0f%%' % pct
                  else:
                      inner = ''
                  segs += ('<div class="seg" style="width:%.3f%%;background:%s" '
                           'title="%s: %d ms (%.1f%%)">%s</div>'
                           % (pct, color, label, v, pct, inner))
              if not segs:
                  segs = '<div class="seg seg-empty">no data</div>'
              total_txt = ('%d ms' % total) if total else 'n/a'
              phase_bars += ('<div class="bar-row"><div class="bar-name">%s</div>'
                             '<div class="stack">%s</div>'
                             '<div class="bar-val">%s</div></div>'
                             % (name, segs, total_txt))

          legend1 = ''.join(
              '<span><span class="swatch" style="background:%s"></span>%s</span>'
              % (color, label) for _, label, color in PHASES)

          # Chart 2: posted results vs baseline, one group per metric
          legend2 = ''.join(
              '<span><span class="swatch" style="background:%s"></span>%s</span>'
              % (color, name) for name, _, color in benches)
          legend2 += ('<span><span class="swatch" style="background:#bab0ac"></span>'
                      'Baseline</span>')

          cmp_blocks = ''
          for k, label, _ in METRICS:
              base = BASELINE[k]
              entries = [('Baseline', base, '#bab0ac', None)]
              entries += [(name, num(d, k), color, d) for name, d, color in benches]
              known = [v for _, v, _, _ in entries if v is not None]
              mx = max(known) if known else 1
              rows = ''
              for name, v, color, d in entries:
                  if v is None:
                      width, val_txt, delta = 0, 'n/a', ''
                  else:
                      width = v * 100.0 / mx
                      val_txt = '%d ms' % v
                      if d is None:
                          delta = ''
                      else:
                          diff = v - base
                          pctd = diff * 100.0 / base
                          cls = 'worse' if diff > 0 else ('better' if diff < 0 else 'same')
                          delta = ('<div class="delta %s">%+d ms (%+.1f%% vs baseline)</div>'
                                   % (cls, diff, pctd))
                  rows += ('<div class="bar-row"><div class="bar-name">%s</div>'
                           '<div class="track"><div class="fill" style="width:%.3f%%;'
                           'background:%s"></div></div>'
                           '<div class="bar-val"><div>%s</div>%s</div></div>'
                           % (name, width, color, val_txt, delta))
              cmp_blocks += '<div class="metric"><h3>%s</h3>%s</div>' % (label, rows)

          outputs = ''
          for name, d, _ in benches:
              outputs += ('<details><summary>Raw output: %s</summary><pre>%s</pre></details>'
                          % (name, html.escape(d.get('output', ''))))

          generated = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          page = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>FSS Benchmark Results</title>
            <style>
              body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #222; }
              h2 { margin-top: 2.2rem; border-bottom: 1px solid #ddd; padding-bottom: 0.3rem; }
              .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.9rem; margin: 0.6rem 0 1rem; }
              .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
              .bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
              .bar-name { width: 120px; flex: none; text-align: right; font-size: 0.9rem; }
              .stack { flex: 1; display: flex; height: 34px; border-radius: 4px; overflow: hidden; background: #eee; min-width: 0; }
              .seg { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.75rem; white-space: nowrap; overflow: hidden; box-sizing: border-box; }
              .seg-empty { width: 100%; background: #ddd; color: #777; }
              .track { flex: 1; height: 26px; background: #eee; border-radius: 4px; overflow: hidden; min-width: 0; }
              .fill { height: 100%; border-radius: 4px; }
              .bar-val { width: 210px; flex: none; font-size: 0.85rem; }
              .delta { font-size: 0.75rem; }
              .delta.worse { color: #c0392b; }
              .delta.better { color: #2e7d32; }
              .delta.same { color: #666; }
              .metric { margin: 1.4rem 0; }
              .metric h3 { margin: 0 0 0.4rem; font-size: 1rem; }
              .note { font-size: 0.85rem; color: #555; }
              details { margin: 0.6rem 0; }
              summary { cursor: pointer; }
              pre { background: #f6f6f6; padding: 0.8rem; font-size: 0.8rem; white-space: pre-wrap; overflow-x: auto; margin: 0.4rem 0 0; }
            </style>
          </head>
          <body>
            <h1>FSS Benchmark Results</h1>
            <h3>All measurements are in milliseconds (ms)</h3>

            <h2>Phase Breakdown (100% of total)</h2>
            <div class="legend">SLEGEND1</div>
            SPHASEBARS

            <h2>Results vs Baseline</h2>
            <div class="legend">SLEGEND2</div>
            SCMPBLOCKS
            <p class="note">Baseline: crawl=2058 ms, insertion=975 ms, metadata=10 ms, total=3044 ms</p>

            <h2>Raw Output</h2>
            SOUTPUTS

            <p><em>Generated SGENERATED</em></p>
          </body>
          </html>'''

          os.makedirs('_site', exist_ok=True)
          with open('_site/index.html', 'w') as f:
              f.write(page
                      .replace('SPHASEBARS', phase_bars)
                      .replace('SCMPBLOCKS', cmp_blocks)
                      .replace('SLEGEND1', legend1)
                      .replace('SLEGEND2', legend2)
                      .replace('SGENERATED', generated)
                      .replace('SOUTPUTS', outputs))
          print('Wrote _site/index.html')
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4