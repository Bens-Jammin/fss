name: FSS Benchmark Test

on:
  push:
    branches: [main, benchmark]
  workflow_dispatch: # allows for manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# `bash` resolves to the system bash on ubuntu-latest and to Git Bash on
# windows-latest, so every step below is written once and runs on both.
# The MinGW-w64 toolchain is injected into PATH separately (see Build), which
# is why we do not need the msys2 shell here. Note that GitHub's runner does
# not allow `shell:` to come from the matrix context, hence a literal here.
defaults:
  run:
    shell: bash

jobs:
  Build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep line endings LF (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      # The Windows image ships MSYS2 with pacman but no MinGW-w64 toolchain,
      # no `make`, and a Rust that defaults to the MSVC host triple. The C++
      # backend links stdc++/sqlite3 as MinGW archives, so we need a complete
      # MinGW-w64 environment *including* a GNU-host Rust. Installing all of it
      # from one pacman repo keeps the ABI consistent (UCRT everywhere) instead
      # of mixing rustup's bundled runtime with MSYS2's libstdc++.
      - name: Install MinGW-w64 toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          release: false # reuse the C:\msys64 already on the image
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-rust

      - name: Export MinGW-w64 toolchain to PATH (Windows)
        if: runner.os == 'Windows'
        env:
          MSYS_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          # GITHUB_PATH is parsed by the Windows runner, so it needs Windows paths.
          # GITHUB_ENV is consumed by bash below, so it needs the POSIX form.
          printf '%s\n' "$MSYS_LOCATION\\ucrt64\\bin" "$MSYS_LOCATION\\usr\\bin" >> "$GITHUB_PATH"
          echo "MAKE=$(cygpath -u "$MSYS_LOCATION")/usr/bin/make.exe" >> "$GITHUB_ENV"
          echo "MAKE=$MAKE"

      - name: Set make (Linux)
        if: runner.os != 'Windows'
        run: echo "MAKE=make" >> "$GITHUB_ENV"

      - name: Verify toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          g++ --version
          ar --version
          cargo --version
          rustc -vV | grep host

      - name: Compile code
        run: |
          "$MAKE" lib
          "$MAKE" cli

      - name: Package the CLI
        run: |
          mkdir -p fss-bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp apps/target/release/fss_cli.exe fss-bin/fss.exe
          else
            cp apps/target/release/fss_cli fss-bin/fss
          fi
          chmod +x fss-bin/fss*
          ./fss-bin/fss --help

      - uses: actions/upload-artifact@v4
        with:
          name: fss-${{ matrix.os }}
          path: fss-bin/
          if-no-files-found: error

  Benchmark:
    name: ${{ matrix.benchmark }} (${{ matrix.os }})
    needs: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        benchmark: [balanced, wide_deep]
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep line endings LF (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 runtime (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-libsqlite3
            mingw-w64-ucrt-x86_64-libstdcxx
            mingw-w64-ucrt-x86_64-libgcc
            mingw-w64-ucrt-x86_64-libwinpthread-git

      - name: Export MinGW-w64 runtime to PATH (Windows)
        if: runner.os == 'Windows'
        env:
          MSYS_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: printf '%s\n' "$MSYS_LOCATION\\ucrt64\\bin" >> "$GITHUB_PATH"

      - name: Download FSS
        uses: actions/download-artifact@v4
        with:
          name: fss-${{ matrix.os }}
          path: fss-bin

      - name: Verify FSS
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./fss-bin/fss.exe --help
          else
            ./fss-bin/fss --help
          fi

      # On Linux the tree lives at the filesystem root, which needs sudo once.
      - name: Create benchmark root (Linux)
        if: runner.os != 'Windows'
        run: |
          sudo mkdir -p /benchmark_trees
          sudo chown "$(id -u):$(id -g)" /benchmark_trees

      # Defender scans every file create and every file read. Left on, it
      # dominates the measurement and swamps the differences we actually care
      # about, so exclude the tree from real-time scanning.
      - name: Exclude benchmark root from Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath 'D:\benchmark_trees'
          Add-MpPreference -ExclusionProcess 'fss.exe'
          Write-Host 'Defender exclusions added.'

      - name: Resolve benchmark root
        run: |
          if [ "$RUNNER_OS" = 'Windows' ]; then
            root='/d/benchmark_trees'
          else
            root='/benchmark_trees'
          fi
          echo "BENCH_ROOT=$root" >> "$GITHUB_ENV"
          echo "BENCH_ROOT=$root"

      - name: Prepare benchmark tree
        run: bash .github/scripts/make_trees.sh "$BENCH_ROOT" '${{ matrix.benchmark }}'

      - name: Build index
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            fss_bin=./fss-bin/fss.exe
          else
            fss_bin=./fss-bin/fss
          fi
          "$fss_bin" init --root "$BENCH_ROOT/${{ matrix.benchmark }}" 2>&1 | tee index_output.txt

      - name: Collect indexing timing data
        run: |
          bash .github/scripts/collect_timings.sh \
            index_output.txt \
            '${{ matrix.benchmark }}' \
            '${{ matrix.os }}' \
            'results-${{ matrix.os }}-${{ matrix.benchmark }}.json'

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-${{ matrix.benchmark }}
          path: results-*.json
          if-no-files-found: error

  Publish-Results:
    runs-on: ubuntu-latest
    needs: [Benchmark]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FSS_PAGES_PAT: ${{ secrets.FSS_PAGES_PAT }}
    steps:
      - name: Enable GitHub Pages site
        if: env.FSS_PAGES_PAT != ''
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $FSS_PAGES_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          if [ "$code" = "404" ]; then
            echo "Pages site missing - creating it..."
            curl -s -X POST \
              -H "Authorization: Bearer $FSS_PAGES_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}'
          else
            echo "Pages site exists (HTTP $code)"
          fi
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Generate HTML report
        run: |
          python3 - <<'EOF'
          import json, glob, html, os, datetime

          BASELINE = {'fscrawl_ms': 2058, 'insert_ms': 975, 'metadata_ms': 10, 'total_ms': 3044}
          PHASES = [
              ('fscrawl_ms', 'File Crawling', '#4e79a7'),
              ('insert_ms', 'DB Insertion', '#f28e2b'),
              ('metadata_ms', 'Metadata Recording', '#59a14f'),
          ]
          METRICS = PHASES + [('total_ms', 'Total', '#b07aa1')]
          BENCH_COLORS = ['#4e79a7', '#e15759', '#76b7b2', '#f28e2b']


          def num(d, key):
              try:
                  v = float(str(d.get(key, '')).strip())
                  return int(v) if v == int(v) else v
              except (TypeError, ValueError):
                  return None


          def label(d):
              return '%s (%s)' % (d.get('benchmark', '?'), d.get('os', '?'))


          records = []
          for path in sorted(glob.glob('results/*.json')):
              with open(path) as f:
                  records.append(json.load(f))

          benches = []
          ordered = sorted(records, key=lambda r: (str(r.get('benchmark', '?')), str(r.get('os', '?'))))
          for i, d in enumerate(ordered):
              benches.append((html.escape(label(d)), d,
                              BENCH_COLORS[i % len(BENCH_COLORS)]))

          # Chart 1: horizontal 100% stacked bars (phase breakdown per benchmark).
          # Self-normalised, so this is the chart that compares cleanly across
          # operating systems.
          phase_bars = ''
          for name, d, _ in benches:
              vals = {k: num(d, k) for k, _, _ in PHASES}
              total = num(d, 'total_ms')
              known = [v for v in vals.values() if v is not None]
              if not total:
                  total = sum(known) if known else 0
              segs = ''
              for k, label, color in PHASES:
                  v = vals[k]
                  if v is None or total <= 0:
                      continue
                  pct = min(v * 100.0 / total, 100.0)
                  if pct >= 14:
                      inner = '%d ms (%.0f%%)' % (v, pct)
                  elif pct >= 6:
                      inner = '%.0f%%' % pct
                  else:
                      inner = ''
                  segs += ('<div class="seg" style="width:%.3f%%;background:%s" '
                           'title="%s: %d ms (%.1f%%)">%s</div>'
                           % (pct, color, label, v, pct, inner))
              if not segs:
                  segs = '<div class="seg seg-empty">no data</div>'
              total_txt = ('%d ms' % total) if total else 'n/a'
              phase_bars += ('<div class="bar-row"><div class="bar-name">%s</div>'
                             '<div class="stack">%s</div>'
                             '<div class="bar-val">%s</div></div>'
                             % (name, segs, total_txt))

          legend1 = ''.join(
              '<span><span class="swatch" style="background:%s"></span>%s</span>'
              % (color, label) for _, label, color in PHASES)

          # Chart 2: posted results vs baseline, one group per metric.
          legend2 = ''.join(
              '<span><span class="swatch" style="background:%s"></span>%s</span>'
              % (color, name) for name, _, color in benches)
          legend2 += ('<span><span class="swatch" style="background:#bab0ac"></span>'
                      'Linux baseline</span>')

          cmp_blocks = ''
          for k, label, _ in METRICS:
              base = BASELINE[k]
              entries = [('Linux baseline', base, '#bab0ac', None)]
              entries += [(name, num(d, k), color, d) for name, d, color in benches]
              known = [v for _, v, _, _ in entries if v is not None]
              mx = max(known) if known else 1
              rows = ''
              for name, v, color, d in entries:
                  if v is None:
                      width, val_txt, delta = 0, 'n/a', ''
                  else:
                      width = v * 100.0 / mx
                      val_txt = '%d ms' % v
                      if d is None:
                          delta = ''
                      elif d.get('os') != 'ubuntu-latest':
                          # The baseline was measured on Linux, so a percentage
                          # delta against it would be meaningless.
                          delta = '<div class="delta">no Linux baseline for this OS</div>'
                      else:
                          diff = v - base
                          pctd = diff * 100.0 / base
                          cls = 'worse' if diff > 0 else ('better' if diff < 0 else 'same')
                          delta = ('<div class="delta %s">%+d ms (%+.1f%% vs baseline)</div>'
                                   % (cls, diff, pctd))
                  rows += ('<div class="bar-row"><div class="bar-name">%s</div>'
                           '<div class="track"><div class="fill" style="width:%.3f%%;'
                           'background:%s"></div></div>'
                           '<div class="bar-val"><div>%s</div>%s</div></div>'
                           % (name, width, color, val_txt, delta))
              cmp_blocks += '<div class="metric"><h3>%s</h3>%s</div>' % (label, rows)

          outputs = ''
          for name, d, _ in benches:
              outputs += ('<details><summary>Raw output: %s</summary><pre>%s</pre></details>'
                          % (name, html.escape(d.get('output', ''))))

          generated = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          page = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>FSS Benchmark Results</title>
            <style>
              body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #222; }
              h2 { margin-top: 2.2rem; border-bottom: 1px solid #ddd; padding-bottom: 0.3rem; }
              .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.9rem; margin: 0.6rem 0 1rem; }
              .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
              .bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
              .bar-name { width: 200px; flex: none; text-align: right; font-size: 0.9rem; }
              .stack { flex: 1; display: flex; height: 34px; border-radius: 4px; overflow: hidden; background: #eee; min-width: 0; }
              .seg { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.75rem; white-space: nowrap; overflow: hidden; box-sizing: border-box; }
              .seg-empty { width: 100%; background: #ddd; color: #777; }
              .track { flex: 1; height: 26px; background: #eee; border-radius: 4px; overflow: hidden; min-width: 0; }
              .fill { height: 100%; border-radius: 4px; }
              .bar-val { width: 210px; flex: none; font-size: 0.85rem; }
              .delta { font-size: 0.75rem; }
              .delta.worse { color: #c0392b; }
              .delta.better { color: #2e7d32; }
              .delta.same { color: #666; }
              .metric { margin: 1.4rem 0; }
              .metric h3 { margin: 0 0 0.4rem; font-size: 1rem; }
              .note { font-size: 0.85rem; color: #555; }
              details { margin: 0.6rem 0; }
              summary { cursor: pointer; }
              pre { background: #f6f6f6; padding: 0.8rem; font-size: 0.8rem; white-space: pre-wrap; overflow-x: auto; margin: 0.4rem 0 0; }
            </style>
          </head>
          <body>
            <h1>FSS Benchmark Results</h1>
            <h3>All measurements are in milliseconds (ms)</h3>

            <h2>Phase Breakdown (100% of total)</h2>
            <p class="note">Each bar is normalised to its own run, so this chart
            is comparable across operating systems.</p>
            <div class="legend">SLEGEND1</div>
            SPHASEBARS

            <h2>Results vs Baseline</h2>
            <p class="note">The baseline was measured on ubuntu-latest, so deltas
            are only shown for the Linux runs. Absolute times are still listed for
            every run, and the two operating systems do different amounts of work
            per file, so cross-OS absolute comparisons are not apples to apples.</p>
            <div class="legend">SLEGEND2</div>
            SCMPBLOCKS
            <p class="note">Baseline: crawl=2058 ms, insertion=975 ms, metadata=10 ms, total=3044 ms</p>

            <h2>Raw Output</h2>
            SOUTPUTS

            <p><em>Generated SGENERATED</em></p>
          </body>
          </html>'''

          os.makedirs('_site', exist_ok=True)
          with open('_site/index.html', 'w') as f:
              f.write(page
                      .replace('SPHASEBARS', phase_bars)
                      .replace('SCMPBLOCKS', cmp_blocks)
                      .replace('SLEGEND1', legend1)
                      .replace('SLEGEND2', legend2)
                      .replace('SGENERATED', generated)
                      .replace('SOUTPUTS', outputs))
          print('Wrote _site/index.html')
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
