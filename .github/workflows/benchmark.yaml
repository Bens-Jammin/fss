name: FSS Benchmark Test

on:
  push:
    branches: [main, benchmark]
  workflow_dispatch: # allows for manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  Build-and-Setup-Benchmark:  # build fss executables
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Compile code
        run: |
          make lib
          make cli
      # TODO: test FAILS!
      # - name: Test functionality of FSS
      #   run: make test
      - name: Add CLI executable to bin
        run: |
          bin=$(find . -type f -perm -u+x \( -name 'fss_cli' -o -name 'fss-cli' \) -not -path '*/deps/*' | head -n 1)
          if [ -z "$bin" ]; then
            echo "CLI binary not found" >&2
            exit 1
          fi
          sudo install -m 755 "$bin" /usr/local/bin/fss
          fss --help
      - uses: actions/upload-artifact@v4
        with:
          name: fss
          path: /usr/local/bin/fss
  BENCHMARK-NiTH-Balanced:
    runs-on: ubuntu-latest
    needs: Build-and-Setup-Benchmark
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fss
          path: .
      - name: Install FSS
        run: |
          chmod +x fss
          sudo install -m 755 fss /usr/local/bin/fss
      - name: Verify FSS
        run: |
          which fss
          fss --help
      - name: Prepare benchmark trees
        run: |
          cd /
          sudo rm -rf benchmark_trees
          sudo mkdir benchmark_trees
          sudo chown "$USER:$(id -gn)" benchmark_trees
          cd benchmark_trees

          # ============================================================
          # BALANCED TREE
          #
          # 10-way branching, 5 levels deep.
          # 10^5 = 100,000 leaf directories
          # 1 file per leaf = ~100,000 files
          # ============================================================

          mkdir balanced

          # 1. Create all 100,000 nested directories in one shot
          mkdir -p balanced/{01..10}/{01..10}/{01..10}/{01..10}/{01..10}

          # 2. Create the file inside every directory instantly
          touch balanced/{01..10}/{01..10}/{01..10}/{01..10}/{01..10}/file

          # Needle deliberately placed in the final directory.
          touch balanced/10/10/10/10/10/NEEDLE

          # ============================================================
          # SUMMARY
          # ============================================================

          echo "Benchmark trees created:"
          echo
          echo "Balanced:"
          find balanced -type f | wc -l

          echo
          echo "Total:"
          find . -type f | wc -l

          echo
          echo "Needles:"
          find . -name NEEDLE -print

      - name: Build balanced index and connect
        run: |
          fss init --root "/benchmark_trees/balanced"
          fss connect --root "/benchmark_trees/balanced"
      - name: Run search
        run: |
          fss find --pattern "NEEDLE" 2>&1 | tee /tmp/search_output.txt
      - name: Collect benchmark data
        run: |
          output=$(cat /tmp/search_output.txt)
          count=$(echo "$output" | grep -oP 'Found \K[0-9]+' | head -n1)
          ms=$(echo "$output" | grep -oP 'in \K[0-9.]+(?=s)' | head -n1)
          [ -z "$count" ] && count="unknown"
          [ -z "$ms" ] && ms="unknown"
          jq -n \
            --arg benchmark "balanced" \
            --arg results "$count" \
            --arg time_s "$ms" \
            --arg output "$output" \
            '{benchmark: $benchmark, results: $results, time_s: $time_s, output: $output}' \
            > benchmark-balanced.json
          cat benchmark-balanced.json
      - name: Verify correct result
        run: |
          if grep -q "NEEDLE" /tmp/search_output.txt && grep -q "Found 1 result" /tmp/search_output.txt; then
            echo "PASS: expected exactly 1 result"
          else
            echo "FAIL: expected exactly 1 result for NEEDLE" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: results-balanced
          path: benchmark-balanced.json
  BENCHMARK-NiTH-WideDeep:
    runs-on: ubuntu-latest
    needs: Build-and-Setup-Benchmark
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fss
          path: .
      - name: Install FSS
        run: |
          chmod +x fss
          sudo install -m 755 fss /usr/local/bin/fss
      - name: Verify FSS
        run: |
          which fss
          fss --help
      - name: Prepare benchmark trees
        run: |
          cd /
          sudo rm -rf benchmark_trees
          sudo mkdir benchmark_trees
          sudo chown "$USER:$(id -gn)" benchmark_trees
          cd benchmark_trees

          # ============================================================
          # WIDE-DEEP TREE
          #
          # 100 x 100 directories, 10 files per leaf.
          # ~100,000 files total.
          # ============================================================

          # 1. Create all 10,000 directories instantly
          mkdir -p wide_deep/{001..100}/{001..100}

          # 2. Create all 100,000 files simultaneously
          touch wide_deep/{001..100}/{001..100}/file_{01..10}

          # Needle deliberately placed in the final leaf.
          touch wide_deep/100/100/NEEDLE

          # ============================================================
          # SUMMARY
          # ============================================================

          echo "Benchmark trees created:"
          echo
          echo "Wide-deep:"
          find wide_deep -type f | wc -l

          echo
          echo "Needles:"
          find . -name NEEDLE -print

      - name: Build index and connect
        run: |
          fss init --root "/benchmark_trees/wide_deep"
          fss connect --root "/benchmark_trees/wide_deep"
      - name: Run search
        run: |
          fss find --pattern "NEEDLE" 2>&1 | tee /tmp/search_output.txt
      - name: Collect benchmark data
        run: |
          output=$(cat /tmp/search_output.txt)
          count=$(echo "$output" | grep -oP 'Found \K[0-9]+' | head -n1)
          ms=$(echo "$output" | grep -oP 'in \K[0-9.]+(?=s)' | head -n1)
          [ -z "$count" ] && count="unknown"
          [ -z "$ms" ] && ms="unknown"
          jq -n \
            --arg benchmark "wide_deep" \
            --arg results "$count" \
            --arg time_s "$ms" \
            --arg output "$output" \
            '{benchmark: $benchmark, results: $results, time_s: $time_s, output: $output}' \
            > benchmark-wide-deep.json
          cat benchmark-wide-deep.json
      - name: Verify correct result
        run: |
          if grep -q "NEEDLE" /tmp/search_output.txt && grep -q "Found 1 result" /tmp/search_output.txt; then
            echo "PASS: expected exactly 1 result"
          else
            echo "FAIL: expected exactly 1 result for NEEDLE" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: results-wide-deep
          path: benchmark-wide-deep.json
  Publish-Results:
    runs-on: ubuntu-latest
    needs: [BENCHMARK-NiTH-Balanced, BENCHMARK-NiTH-WideDeep]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Generate HTML report
        run: |
          python3 - <<'EOF'
          import json, glob, html, os, datetime

          records = []
          for path in sorted(glob.glob('results/*.json')):
              with open(path) as f:
                  records.append(json.load(f))

          rows = ''
          for d in records:
              bench = html.escape(str(d.get('benchmark', '?')))
              count = html.escape(str(d.get('results', 'n/a')))
              ms = html.escape(str(d.get('time_s', 'n/a')))
              out = html.escape(d.get('output', ''))
              rows += (
                  '<tr><td>%s</td><td>%s</td><td>%ss</td><td><pre>%s</pre></td></tr>'
                  % (bench, count, ms, out)
              )

          generated = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          page = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>FSS Benchmark Results</title>
            <style>
              body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; }
              table { border-collapse: collapse; width: 100%; }
              th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
              th { background: #f0f0f0; }
              pre { margin: 0; font-size: 0.8rem; white-space: pre-wrap; }
              code { background: #f4f4f4; padding: 0 2px; }
            </style>
          </head>
          <body>
            <h1>FSS Benchmark Results</h1>
            <table>
              <thead><tr><th>Benchmark</th><th>Results</th><th>Time (s)</th><th>Output</th></tr></thead>
              <tbody>SROWS</tbody>
            </table>
            <p><em>Generated SGENERATED</em></p>
          </body>
          </html>'''

          os.makedirs('_site', exist_ok=True)
          with open('_site/index.html', 'w') as f:
              f.write(page.replace('SROWS', rows).replace('SGENERATED', generated))
          print('Wrote _site/index.html')
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4